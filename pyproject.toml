[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csvdiff-cli"
version = "0.1.0"
description = "Diff two CSV files by key column — added / removed / changed rows with per-field deltas. Pure stdlib, CI-friendly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott", email = "amarel.taylor.s@gmail.com" }]
keywords = ["csv", "diff", "data", "etl", "compare", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Amarel-Taylor-Scott/csvdiff"
Repository = "https://github.com/Amarel-Taylor-Scott/csvdiff"
Issues = "https://github.com/Amarel-Taylor-Scott/csvdiff/issues"

[project.scripts]
csvdiff = "csvdiff.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["csvdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
