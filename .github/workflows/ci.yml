name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev; no network needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI smoke
        run: |
          csvdiff version
          csvdiff diff examples/old.csv examples/new.csv --key id
          csvdiff diff examples/old.csv examples/new.csv --key id --format json > /dev/null
      - name: Tests
        run: pytest -q
      - name: Lint (non-blocking)
        run: ruff check . || true
